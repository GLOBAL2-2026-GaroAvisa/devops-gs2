trigger:
  branches:
    include:
      - main

pool:
  vmImage: 'ubuntu-latest'

variables:
  buildConfiguration: 'Release'
  azureSubscription: 'MyAzureSubscription'
  NOME_WEBAPP: 'gs-garoavisa-rm565698'
  apiProject: 'dotnet-gs2/GaroAvisa.Api/GaroAvisa.Api.csproj'
  testProjects: 'dotnet-gs2/**/*Tests.csproj'
  artifactName: 'app'

stages:

# =========================================================
# 1. BUILD (CI): RESTAURAR, COMPILAR, TESTAR E PUBLICAR O PACOTE
# =========================================================
- stage: CI
  displayName: 'CI - Build e Testes'
  jobs:
    - job: BuildTest
      displayName: 'Compilar e testar API'
      steps:
        - checkout: self

        - task: UseDotNet@2
          displayName: 'Instalar .NET 10 SDK'
          inputs:
            packageType: 'sdk'
            version: '10.x'

        - task: DotNetCoreCLI@2
          displayName: 'Restaurar dependências'
          inputs:
            command: 'restore'
            projects: '$(apiProject)'

        - task: DotNetCoreCLI@2
          displayName: 'Build da API'
          inputs:
            command: 'build'
            projects: '$(apiProject)'
            arguments: '--configuration $(buildConfiguration)'

        - task: DotNetCoreCLI@2
          displayName: 'Testes automatizados (xUnit)'
          inputs:
            command: 'test'
            projects: '$(testProjects)'
            arguments: '--configuration $(buildConfiguration)'
            testRunTitle: 'GaroAvisa - Testes'

        - task: DotNetCoreCLI@2
          displayName: 'Publicar API'
          inputs:
            command: 'publish'
            publishWebProjects: false
            projects: '$(apiProject)'
            arguments: '--configuration $(buildConfiguration) --output $(Build.ArtifactStagingDirectory)/publish'
            zipAfterPublish: false
            modifyOutputPath: false

        - task: ArchiveFiles@2
          displayName: 'Compactar aplicação'
          inputs:
            rootFolderOrFile: '$(Build.ArtifactStagingDirectory)/publish'
            includeRootFolder: false
            archiveType: 'zip'
            archiveFile: '$(Build.ArtifactStagingDirectory)/$(artifactName).zip'
            replaceExistingArchive: true

        - task: PublishPipelineArtifact@1
          displayName: 'Publicar artefato'
          inputs:
            targetPath: '$(Build.ArtifactStagingDirectory)/$(artifactName).zip'
            artifact: '$(artifactName)'
            publishLocation: 'pipeline'

# =========================================================
# 2. RELEASE (CD): DEPLOY NO AZURE WEB APP
# =========================================================
- stage: CD
  displayName: 'CD - Deploy no Azure Web App'
  dependsOn: CI
  condition: succeeded()
  jobs:
    - deployment: DeployWebApp
      displayName: 'Implantar API'
      environment: $(NOME_WEBAPP)
      strategy:
        runOnce:
          deploy:
            steps:
              - download: current
                artifact: '$(artifactName)'

              - task: AzureAppServiceSettings@1
                displayName: 'Configurar variáveis do Web App'
                inputs:
                  azureSubscription: '$(azureSubscription)'
                  appName: '$(NOME_WEBAPP)'
                  appSettings: |
                    [
                      {
                        "name": "ASPNETCORE_ENVIRONMENT",
                        "value": "Production",
                        "slotSetting": false
                      },
                      {
                        "name": "ConnectionStrings__OracleConnection",
                        "value": "$(OracleConnection)",
                        "slotSetting": false
                      },
                      {
                        "name": "Jwt__Key",
                        "value": "$(JwtKey)",
                        "slotSetting": false
                      }
                    ]

              - task: AzureWebApp@1
                displayName: 'Deploy da API'
                inputs:
                  azureSubscription: '$(azureSubscription)'
                  appType: 'webAppLinux'
                  appName: '$(NOME_WEBAPP)'
                  package: '$(Pipeline.Workspace)/$(artifactName)/$(artifactName).zip'
                  deploymentMethod: 'zipDeploy'
                  startUpCommand: 'dotnet GaroAvisa.Api.dll'
